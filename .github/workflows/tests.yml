name: WOLF FANG offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test offline (no external API calls)
        run: bash ./RUN_TESTS.sh
      - name: Offline doctor
        run: bash ./OPEN_WOLF_FANG.sh --doctor
